manifestVersion: 1

package:
  name: robonix.service.fire_detect
  version: 0.1.0
  vendor: xiaolu Wang
  description: Drone fire & smoke detection service -- pulls MJPEG frames from the DJI bridge APK, runs YOLO to detect flame/smoke; attaches the current GPS coordinates on a hit
  license: MulanPSL-2.0
  tags: [fire, smoke, detection, vision, drone]
  maintainers:
    - xiaolu Wang <drqzkk@163.com>

build: bash scripts/build.sh

start: bash scripts/start.sh

stop: |
  pkill -TERM -f "[p]ython3 -m fire_detect.driver" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[p]ython3 -m fire_detect.driver" 2>/dev/null || true

capabilities:
  - name: robonix/service/fire_detect/driver
  - name: robonix/service/fire_detect/fire_detect
  - name: robonix/service/fire_detect/start_monitor
  - name: robonix/service/fire_detect/stop_monitor
  - name: robonix/service/fire_detect/monitor_state

config:
  rc_pro_ip:
    description: DJI bridge APK host address (RC Pro IP)
    type: string
    default: 172.20.10.2
  rc_pro_port:
    description: DJI bridge APK WebServer port
    type: integer
    default: 8080
  model_path:
    description: Fire & smoke YOLO weights path (.pt / .engine / .onnx); leave empty to use the default yolov8n
    type: string
    default: ""
  min_confidence:
    description: Default confidence threshold (0~1)
    type: number
    default: 0.4
