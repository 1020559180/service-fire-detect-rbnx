# Start the real-time fire & smoke monitor: a background thread keeps grabbing frames and inferring; the latest result is read by polling monitor_state.
[contract]
id      = "robonix/service/fire_detect/start_monitor"
version = "1"
kind    = "service"
idl     = "fire_detect/srv/StartMonitor.srv"
description = "Start the real-time fire & smoke monitor (background continuous frame inference); pair with monitor_state polling for real-time alerts."

[mode]
type = "rpc"
